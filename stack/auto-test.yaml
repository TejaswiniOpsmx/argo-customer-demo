apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: git-appset-jsonpath
spec:
  generators:
    - git:
        repoURL: "https://github.com/TejaswiniOpsmx/argo-customer-demo.git"
        revision: "new-test"  # Use your desired branch or commit SHA
        directories:
          - path: "source-path/*"  # The parent directory where config.json resides
  template:
    metadata:
      name: "{{.name}}"  # Dynamically naming the application based on directory name
    spec:
      project: default
      source:
        repoURL: "https://github.com/TejaswiniOpsmx/argo-customer-demo.git"
        targetRevision: "new-test"
        path: "source-path/config.json/*"  # Path to your config.json in the repository
      destination:
        server: "https://kubernetes.default.svc"
        namespace: default
