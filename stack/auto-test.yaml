apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: git-appset-jsonpath
  namespace: argocd
  labels:
    argocd.argoproj.io/instance: sample-app
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: "https://github.com/TejaswiniOpsmx/argo-customer-demo.git"
        revision: "new-test"
        files:
          - path: "source-apps/config.json"
  template:
    metadata:
      name: "{{path.basename}}"  # Assuming 'name' is part of your config.json
    spec:
      project: "default"
      source:
        repoURL: "{{repoURL}}"  # This assumes 'repoURL' is in your config.json
        targetRevision: "{{targetRevision}}"
        path: "{{path}}"
      destination:
        server: "https://kubernetes.default.svc"
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
