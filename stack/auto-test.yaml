apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: git-appset-jsonpath
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: "{{ .repoURL }}"
        targetRevision: "{{ .targetRevision }}"
        directories:
          - path: "{{ .path }}"
        env:
          - name: NAMESPACE
            value: "{{ .namespace }}"
  template:
    metadata:
      name: '{{path.basename}}'
    spec:
      project: default
      source:
        repoURL: "{{ .repoURL }}"
        targetRevision: "{{ .targetRevision }}"
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
