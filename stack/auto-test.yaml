apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: git-appset-jsonpath
  namespace: argocd
  labels:
    argocd.argoproj.io/instance: sample-app
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: "https://github.com/TejaswiniOpsmx/argo-customer-demo.git"
        revision: "new-test"
        files:
          - path: "source-apps/config.json"
        values:
          base_dir: "source-apps/*"
  template:
    metadata:
      name: "{{.base_dir}}" 
    spec:
      project: "default"
      source:
        repoURL: "{{.repoURL}}"
        targetRevision: "{{.targetRevision}}"
        path: "{{.path}}"
      destination:
        server: "https://kubernetes.default.svc"
        namespace: "{{.namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
