apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: git-appset-jsonpath
spec:
  generators:
    - git:
        repoURL: "https://github.com/TejaswiniOpsmx/argo-customer-demo.git"
        revision: "new-test"  # Branch or commit SHA
        path: "source-apps/config.json/*"  # Path to the config.json file
        jsonPath: "$.generators[*].path"  # JSONPath to extract paths from the config.json
  template:
    metadata:
      name: "{{.name}}"  # Dynamically naming the application based on the generator's name
    spec:
      project: default
      source:
        repoURL: "https://github.com/TejaswiniOpsmx/argo-customer-demo.git"
        targetRevision: "new-test"
        path: "{{.path}}"  # Dynamically assigning the path for each generator from the JSONPath
      destination:
        server: "https://kubernetes.default.svc"
        namespace: default
