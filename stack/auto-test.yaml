apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: source-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/TejaswiniOpsmx/argo-customer-demo.git
        revision: new-test
        files:
          - path: "source-apps/config.json"  # Ensure config.json is correctly loaded
        values:
          base_dir: "source-apps"  # Define base_dir here
  template:
    metadata:
      name: '{{ .path.basename | replace ".json" "" }}'  # Name based on config.json
    spec:
      project: default
      source:
        repoURL: "https://github.com/OpsMx/argo-customer-demo.git"
        targetRevision: "new-test"
        path: '{{ .values.base_dir }}'  # Access base_dir from values
      destination:
        server: https://kubernetes.default.svc
        namespace: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true





