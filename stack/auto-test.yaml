apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: source-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - git:
      repoURL: https://github.com/TejaswiniOpsmx/argo-customer-demo.git
      revision: new-test
      directories::
        - path: "source-apps"
  template:
    metadata:
      name: "{{path.basename}}"  # Directly reference the 'name' field for each application
    spec:
      project: default
      source:
        repoURL: "https://github.com/TejaswiniOpsmx/argo-customer-demo.git"
        targetRevision: "new-test"
        path: "source-apps/config.json"  # Directly reference the 'path' field for each application
      destination:
        server: https://kubernetes.default.svc
        namespace: test
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
