apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: source-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - git:
      repoURL: https://github.com/TejaswiniOpsmx/argo-customer-demo.git
      revision: new-test
      files:
        - path: "source-apps/config.json/*"
  template:
   
    metadata:
      name: '{{ .applications.name }}'
    spec:
      project: default
      source:
        repoURL: "https://github.com/TejaswiniOpsmx/argo-customer-demo.git"
        targetRevision: "new-test"
        path: '{{ .applications.path }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: test
      syncPolicy:
        automated:
          prune: true
          selfHeal: true

