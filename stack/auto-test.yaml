apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: git-appset-jsonpath
spec:
  generators:
  - git:
      repoURL: "https://github.com/TejaswiniOpsmx/argo-customer-demo.git"
      revision: "new-test"
      files:
      - path: "source-apps/config.json"  # Reading from config.json in the repo
  template:
    metadata:
      name: "{{name}}"
    spec:
      project: "default"
      source:
        repoURL: "{{repoURL}}"
        targetRevision: "{{targetRevision}}"
        path: "{{path}}"
      destination:
        server: "https://kubernetes.default.svc"
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
