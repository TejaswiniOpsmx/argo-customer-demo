apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: git-appset-jsonpath
spec:
  generators:
    - git:
        repoURL: "https://github.com/TejaswiniOpsmx/argo-customer-demo.git"
        revision: "new-test"  # Branch or commit SHA
        path: "source-path/config.json"  # Path to config.json
        jsonPath: "$.generators[*].path"  # JSONPath to extract all generator paths
  template:
    metadata:
      name: "{{.name}}"  # Dynamic application name based on the directory or path
    spec:
      project: default
      source:
        repoURL: "https://github.com/TejaswiniOpsmx/argo-customer-demo.git"
        targetRevision: "new-test"
        path: "{{.path}}"  # Dynamically assign the path to each generator's path
      destination:
        server: "https://kubernetes.default.svc"
        namespace: default
