apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: source-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/TejaswiniOpsmx/argo-customer-demo.git
        revision: new-test
        files:
          - path: "source-apps/**/*.yaml"  # Path to include files in the repository
        values:
          base_dir: "source-apps"  # Define base_dir here
  template:
    metadata:
      name: '{{ .path | replace "/" "-" }}'  # Replace slashes with dashes to ensure unique names
    spec:
      project: default
      source:
        repoURL: "https://github.com/TejaswiniOpsmx/argo-customer-demo.git"
        targetRevision: "new-test"
        path: '{{ .values.base_dir }}/{{ .path.basename }}'  # Correct path based on base_dir
      destination:
        server: https://kubernetes.default.svc
        namespace: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
