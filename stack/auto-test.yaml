apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: source-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/TejaswiniOpsmx/argo-customer-demo.git
        revision: new-test
        files:
          - path: "source-apps/**/*.json"  # This will include all .yaml files under source-apps
        values:
          base_dir: "source-apps"
  template:
    metadata:
      name: '{{ .values.base_dir | replace "/" "-" }}-{{ .path | string | replace "/" "-" }}'
      project: default
      source:
        repoURL: "https://github.com/TejaswiniOpsmx/argo-customer-demo.git"
        targetRevision: "new-test"
        path: '{{ .values.base_dir }}'  # Set path dynamically for each application file
      destination:
        server: https://kubernetes.default.svc
        namespace: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
