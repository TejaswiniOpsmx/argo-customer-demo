apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: source-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/TejaswiniOpsmx/argo-customer-demo.git
        revision: new-test
        files:
          - path: "source-apps/**/*.yaml"  # This will include all .yaml files under source-apps
  template:
    metadata:
      name: '{{ .path | splitList "/" | join "-" }}-{{ .path.basename }}' # Dynamically set name based on file name
    spec:
      project: default
      source:
        repoURL: "https://github.com/TejaswiniOpsmx/argo-customer-demo.git"
        targetRevision: "new-test"
        path: '{{ .path }}'  # Set path dynamically for each application file
      destination:
        server: https://kubernetes.default.svc
        namespace: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
