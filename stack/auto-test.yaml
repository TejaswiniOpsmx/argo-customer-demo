apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: source-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/TejaswiniOpsmx/argo-customer-demo.git
        revision: new-test
        files:
          - path: "source-apps/config.json"  # Path to the config.json file
  template:
    metadata:
      name: '{{ .applications.name }}'  # Use the "name" from config.json for the application name
    spec:
      project: default
      source:
        repoURL: "https://github.com/TejaswiniOpsmx/argo-customer-demo.git"
        targetRevision: "new-test"
        path: '{{ .path }}'  # Use the "path" from config.json for the application path
      destination:
        server: https://kubernetes.default.svc
        namespace: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
