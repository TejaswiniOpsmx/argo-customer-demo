apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: source-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - git:
      repoURL: https://github.com/TejaswiniOpsmx/argo-customer-demo.git
      revision: new-test
      files:
        - path: "source-apps/config.json/*"  # This will recursively include all .yaml files under the source-apps directory
      # values:
      #   base_dir: "{{index .path.segments 0}}/{{index .path.segments 1}}/{{index .path.segments 2}}"
  template:
    metadata:
      name: '{{ .name }}'  # Dynamic name based on the file being deployed
    spec:
      project: default
      source:
        repoURL: https://github.com/TejaswiniOpsmx/argo-customer-demo.git
        targetRevision: "new-test"
        # base_dir: "{{index .path.segments 0}}/{{index .path.segments 1}}/{{index .path.segments 2}}"
        path: "{{ .path.basename }}"  # Use the base_dir to target the correct path
      destination:
        server: https://kubernetes.default.svc
        namespace: test
      syncPolicy:
        automated:
          prune: true
          selfHeal: true  # Use the basename of the application directory for the namespace



